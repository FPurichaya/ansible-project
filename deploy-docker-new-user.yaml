---
- name: Install docker
  hosts: docker_server
  become: yes
  tasks:
    - name: Ensure docker is installed
      yum: 
        name: docker
        update_cache: yes
        state: present
    - name: Ensure docker is running
      systemd: 
        name: docker
        state: started

- name: Create new linux user
  hosts: docker_server
  become: yes
  vars_files:
    - project-vars.yaml
  tasks: 
    - name: Create linux user
      user:
        name: jeepek
        groups: "{{user_groups}}"

- name: Install docker-compose
  hosts: docker_server
  become: yes
  become_user: jeepek
  tasks: 
    - name: Create docker-compose directory
      file:
        path: ~/.docker/cli-plugins
        state: directory
    - name: Get architecture of remote machine
      shell: uname -m
      register: remote_arch
    - name: Install docker-compose
      get_url: 
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ remote_arch.stdout }}"
        dest: ~/.docker/cli-plugins/docker-compose
        mode: +x

- name: Start docker containers
  hosts: docker_server
  become: yes
  become_user: jeepek
  vars_files:
    - project-vars.yaml
  tasks:
    - name: Copy docker compose
      copy: 
        src: /Users/jeepek/bootcamp-java-mysql-project/docker-compose-full.yaml
        dest: /home/jeepek/docker-compose.yaml
    - name: Docker login
      docker_login: 
        username: fpurichaya
        password: "{{docker_password}}"
    - name: Start container from compose
      community.docker.docker_compose_v2:
        project_src: /home/jeepek
        state: present